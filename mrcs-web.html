<html>
    <head>
        <title>MRCS</title>
        <meta charset="UTF-8"/>
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/vue@3.5.41/dist/vue.global.prod.js"></script>
        <script src="./dst/mrcs-api.umd.js"></script>
        <style>
            body {
                background-color: #303030;
                color: #ffffff;
                font-family: "Source Sans Pro", sans-serif;
                font-size: 11pt;
                margin: 50px;
            }
            .scheme {
                display: flex;
                flex-direction: row;
                justify-content: flex-start;
                align-items: flex-start;
            }
            .scheme .scheme-col {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                margin-right: 8px;
            }
            .scheme .spec-item {
                width: 220px;
                margin-bottom: 24px;
                background-color: #404040;
                border-radius: 4px;
                padding: 12px 4px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .scheme .spec-item .name {
                color: #c0c0c0;
            }
            .scheme input.value {
                color: #f0f0f0;
                background-color: #505050;
                border: 0;
                border-radius: 4px;
                width: 200px;
                font-family: "Source Code Pro", monospace;
                font-size: 11pt;
                margin-top: 4px;
                text-align: center;
            }
            .scheme .spec-item.invalid {
                color: #f0d0b0;
                background-color: #705030;
            }
            .scheme .spec-item.invalid .name {
                color: #f0d0b0;
            }
            .scheme .spec-item.invalid input.value {
                color: #f0d0b0;
                background-color: #907050;
            }
            .scheme input.value:hover,
            .scheme input.value:focus {
                color: #b0d0ff;
                background-color: #507090;
                outline: none;
            }
            .scheme .spec-item .base {
                width: 200px;
                height: 20px;
                border-radius: 4px;
                margin-top: 4px;
            }
            .scheme .sample-item {
                width:  200px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                font-family: "Source Code Pro", monospace;
                font-size: 9pt;
                border-radius: 4px;
                padding: 8px 4px;
                margin-bottom: 4px;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>Multi-Ramp Coloring Scheme</h1>

            <p>
                Enter 1 to 4 color specifications of the format:<br/>
                <code>[&lt;name&gt;:]&lt;rgb&gt;[^][+&lt;floor&gt;][-&lt;ceiling&gt;][/&lt;count&gt;]</code><br/>
                to see their generated color ramps, from darkest to lightest:
            </p>

            <div class="scheme">
                <div v-for="(entry, i) in scheme" v-bind:key="i" class="scheme-col">
                    <div class="spec-item" v-bind:class="{ invalid: entry.invalid }">
                        <div class="name">{{ entry.name === "" ? `color ${i + 1}` : entry.name }}</div>
                        <input class="value" v-model="specs[i]"/>
                        <div v-if="entry.base !== ''" class="base"
                            v-bind:style="{ backgroundColor: entry.base }"></div>
                    </div>
                    <div v-for="(color, n) in entry.colors" v-bind:key="n" class="sample-item"
                        v-bind:style="{ backgroundColor: color, color: contrast(color) }">
                        {{ color }}
                    </div>
                </div>
            </div>
        </div>
    <script>
        const app = Vue.createApp({
            data () {
                return {
                    specs: [ "grey:#808080", "blue:#336699", "brown:#336699^", "green:#993333+40-20/5" ]
                }
            },
            computed: {
                /*  (re-)compute the color ramp of every specification  */
                scheme () {
                    return this.specs.map((spec) => {
                        const m = spec.match(/^\s*(?:([^:]+):)?(.*?)\s*$/)
                        const name = m[1] ?? ""
                        if (m[2] === "")
                            return { name, base: "", colors: [], invalid: false }
                        try {
                            /*  the base color is shown as the reference of the color ramp  */
                            const parsed = MRCS.parse(m[2])
                            return { name, base: parsed.rgb, colors: MRCS.generate(parsed), invalid: false }
                        }
                        catch (ex) {
                            return { name, base: "", colors: [], invalid: true }
                        }
                    })
                }
            },
            methods: {
                /*  determine a readable text color for a background color  */
                contrast (color) {
                    const r = parseInt(color.slice(1, 3), 16)
                    const g = parseInt(color.slice(3, 5), 16)
                    const b = parseInt(color.slice(5, 7), 16)
                    return ((0.299 * r) + (0.587 * g) + (0.114 * b)) > 140 ? "#000000" : "#ffffff"
                }
            }
        })
        app.mount("body")
    </script>
    </body>
</html>
